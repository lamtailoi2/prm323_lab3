<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internly Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">I</span>
        <div>
          <h1>Internly Admin</h1>
          <p id="project-line" class="muted">Connecting…</p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot" id="status-dot" aria-hidden="true"></span>
        <span id="status-text">Checking credentials…</span>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main>
      <aside class="panel users-panel" aria-labelledby="users-heading">
        <div class="panel-head">
          <h2 id="users-heading">Users</h2>
          <button id="refresh-users" class="ghost" type="button">Refresh</button>
        </div>
        <label class="search">
          <span class="visually-hidden">Filter users</span>
          <input
            id="user-search"
            type="search"
            placeholder="Filter by name, email or uid"
            autocomplete="off"
          />
        </label>
        <p class="muted" id="users-summary">Loading users…</p>
        <ul id="user-list" class="user-list"></ul>
      </aside>

      <section class="column">
        <form class="panel" id="send-form">
          <div class="panel-head">
            <h2>Send notification</h2>
            <span class="pill" id="target-pill">No user selected</span>
          </div>

          <label>
            <span>Target</span>
            <select id="target">
              <option value="uid">Selected user</option>
              <option value="all">All users with a token</option>
            </select>
          </label>

          <label>
            <span>Title</span>
            <input id="title" maxlength="200" required placeholder="New internship for you" />
          </label>

          <label>
            <span>Body</span>
            <textarea
              id="body"
              rows="3"
              maxlength="1000"
              placeholder="A Flutter internship just matched your preferences."
            ></textarea>
          </label>

          <label>
            <span>Route (optional)</span>
            <input id="route" list="route-suggestions" placeholder="/saved" />
            <datalist id="route-suggestions">
              <option value="/home"></option>
              <option value="/search"></option>
              <option value="/saved"></option>
              <option value="/applications"></option>
              <option value="/profile"></option>
            </datalist>
          </label>

          <label class="checkbox">
            <input type="checkbox" id="save-history" checked />
            <span>Write to the user's notification history</span>
          </label>

          <button id="send-button" type="submit">Send</button>
          <div id="send-result" class="result" hidden></div>
        </form>

        <section class="panel" aria-labelledby="history-heading">
          <div class="panel-head">
            <h2 id="history-heading">Notification history</h2>
            <div class="actions">
              <button id="refresh-history" class="ghost" type="button">Refresh</button>
              <button id="clear-history" class="ghost danger" type="button">Clear</button>
            </div>
          </div>
          <p class="muted" id="history-summary">Select a user to see their history.</p>
          <ul id="history-list" class="history-list"></ul>
        </section>
      </section>
    </main>

    <footer>
      Local tool · binds to 127.0.0.1 · the service-account key never enters the
      repository.
    </footer>

    <script src="app.js"></script>
  </body>
</html>
