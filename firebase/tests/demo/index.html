<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internly · Firebase rules demo</title>
    <style>
      :root {
        --ink: #16181d;
        --muted: #5b616e;
        --line: #dfe2e8;
        --bg: #f6f7f9;
        --card: #ffffff;
        --pass: #1a7f45;
        --pass-bg: #e4f4ea;
        --fail: #b42318;
        --fail-bg: #fde7e5;
        --run: #8a5a00;
        --run-bg: #fdf1d6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      code {
        font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }

      button {
        padding: 12px 20px;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font: 600 15px/1 inherit;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: #fafbfc;
        font: 600 12px/1.2 inherit;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: left;
      }

      td {
        padding: 11px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      tr.group td {
        padding: 10px 16px;
        background: #f1f3f6;
        font: 600 12px/1.2 inherit;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td.index {
        width: 40px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      td.actor {
        width: 110px;
        white-space: nowrap;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 13px;
      }

      td.expect {
        width: 100px;
        white-space: nowrap;
      }

      td.result {
        width: 120px;
      }

      .chip {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font: 700 11px/1.4 inherit;
        letter-spacing: 0.04em;
      }

      .wait {
        background: #eceef2;
        color: var(--muted);
      }

      .running {
        background: var(--run-bg);
        color: var(--run);
      }

      .pass {
        background: var(--pass-bg);
        color: var(--pass);
      }

      .fail {
        background: var(--fail-bg);
        color: var(--fail);
      }

      .error {
        margin-top: 4px;
        color: var(--fail);
        font-size: 12px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 20px;
        border-top: 1px solid var(--line);
        background: #fafbfc;
        font-size: 14px;
      }

      #summary {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Internly · Firebase security rules</h1>
        <p>
          <code>firebase/firestore.rules</code> and <code>firebase/storage.rules</code> against the
          local emulators. Every row is a real request.
        </p>
      </div>
      <button id="run" type="button">Run all checks</button>
    </header>

    <div class="panel">
      <div class="meta">
        <span>Project <code>demo-internly</code></span>
        <span>Firestore <code>127.0.0.1:8080</code></span>
        <span>Storage <code>127.0.0.1:9199</code></span>
        <span><a href="http://localhost:4000" target="_blank" rel="noreferrer">Emulator UI</a></span>
      </div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Who</th>
            <th>Request</th>
            <th>Expected</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="5" style="color: var(--muted)">Press “Run all checks” to start.</td>
          </tr>
        </tbody>
      </table>
      <footer>
        <span id="summary">Not run</span>
        <span style="color: var(--muted)" id="timing"></span>
      </footer>
    </div>

    <script>
      const runButton = document.querySelector('#run');
      const rows = document.querySelector('#rows');
      const summary = document.querySelector('#summary');
      const timing = document.querySelector('#timing');

      let cells = [];

      const chip = (kind, text) => {
        const span = document.createElement('span');
        span.className = `chip ${kind}`;
        span.textContent = text;
        return span;
      };

      function render(scenarios) {
        rows.textContent = '';
        cells = [];
        let group = null;
        scenarios.forEach((scenario, index) => {
          if (scenario.group !== group) {
            group = scenario.group;
            const heading = document.createElement('tr');
            heading.className = 'group';
            const cell = document.createElement('td');
            cell.colSpan = 5;
            cell.textContent = group;
            heading.append(cell);
            rows.append(heading);
          }

          const row = document.createElement('tr');
          const indexCell = document.createElement('td');
          indexCell.className = 'index';
          indexCell.textContent = String(index + 1);

          const actor = document.createElement('td');
          actor.className = 'actor';
          actor.textContent = scenario.actor;

          const action = document.createElement('td');
          action.textContent = scenario.action;

          const expect = document.createElement('td');
          expect.className = 'expect';
          expect.append(chip(scenario.expected === 'allowed' ? 'pass' : 'fail', scenario.expected));

          const result = document.createElement('td');
          result.className = 'result';
          result.append(chip('wait', 'waiting'));

          row.append(indexCell, actor, action, expect, result);
          rows.append(row);
          cells.push({ row, result });
        });
      }

      function setResult(index, ok, message, ms) {
        const cell = cells[index];
        if (!cell) return;
        cell.result.textContent = '';
        cell.result.append(chip(ok ? 'pass' : 'fail', ok ? 'pass' : 'fail'));
        if (message) {
          const detail = document.createElement('div');
          detail.className = 'error';
          detail.textContent = message;
          cell.result.append(detail);
        }
        if (ms !== undefined) cell.row.title = `${ms} ms`;
      }

      async function run() {
        runButton.disabled = true;
        summary.textContent = 'Running…';
        timing.textContent = '';

        try {
          const response = await fetch('/run', { cache: 'no-store' });
          if (!response.ok) {
            summary.textContent = `Run failed: ${response.status}`;
            return;
          }

          const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
          let buffer = '';
          let total = 0;

          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += value;
            let newline;
            while ((newline = buffer.indexOf('\n')) >= 0) {
              const line = buffer.slice(0, newline).trim();
              buffer = buffer.slice(newline + 1);
              if (!line) continue;

              const message = JSON.parse(line);
              if (message.type === 'plan') {
                total = message.total;
                render(message.scenarios);
                summary.textContent = `0 / ${total} checked`;
              } else if (message.type === 'start') {
                const cell = cells[message.index];
                if (cell) {
                  cell.result.textContent = '';
                  cell.result.append(chip('running', 'running'));
                }
              } else if (message.type === 'result') {
                setResult(message.index, message.ok, message.error, message.ms);
                const checked = cells.filter(
                  (cell) => cell.result.querySelector('.pass, .fail'),
                ).length;
                summary.textContent = `${checked} / ${total} checked`;
              } else if (message.type === 'done') {
                summary.textContent = `${message.passed} / ${message.total} passed${
                  message.failed ? ` · ${message.failed} failed` : ''
                }`;
                summary.style.color = message.failed ? 'var(--fail)' : 'var(--pass)';
                timing.textContent = `${(message.ms / 1000).toFixed(2)} s`;
              } else if (message.type === 'fatal') {
                summary.textContent = `Run failed: ${message.error}`;
                summary.style.color = 'var(--fail)';
              }
            }
          }
        } catch (error) {
          summary.textContent = `Run failed: ${error.message}`;
        } finally {
          runButton.disabled = false;
        }
      }

      runButton.addEventListener('click', () => {
        summary.style.color = 'var(--ink)';
        run();
      });
    </script>
  </body>
</html>
